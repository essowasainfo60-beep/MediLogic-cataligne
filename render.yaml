services:
  - type: web
    name: medilogic-cataligne
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    # Les valeurs sont saisies dans le tableau de bord Render (jamais dans Git).
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
