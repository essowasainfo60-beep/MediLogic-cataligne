{# En-tête d'une étape du formulaire article : {% with n=1, titre='…', aide='…' %}{% include 'boutique/_etape.html' %}{% endwith %} #}
<div class="flex items-start gap-3 mb-4">
    <span class="h-8 w-8 rounded-full bg-purple-600 text-white font-bold flex items-center justify-center flex-shrink-0">{{ n }}</span>
    <div class="min-w-0">
        <h2 class="text-lg font-bold text-gray-900 leading-tight">{{ titre }}</h2>
        {% if aide %}<p class="text-sm text-gray-500">{{ aide }}</p>{% endif %}
    </div>
</div>
