{% extends "base.html" %}

{% block title %}Changer le mot de passe{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-6">
    <div class="bg-white rounded-2xl shadow-md p-6">
        <div class="flex items-center gap-3 mb-5">
            <span class="h-11 w-11 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center"><i class="fas fa-key"></i></span>
            <div>
                <h1 class="text-xl font-bold text-gray-900">Changer le mot de passe</h1>
                <p class="text-sm text-gray-500">{{ current_user.email }}</p>
            </div>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Mot de passe actuel</label>
                <input type="password" name="actuel" required autocomplete="current-password" class="w-full px-3 py-2.5 border border-gray-300">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Nouveau mot de passe</label>
                <div class="relative">
                    <input type="password" name="nouveau" id="nouveau" required autocomplete="new-password" minlength="8" class="w-full px-3 py-2.5 pr-10 border border-gray-300">
                    <button type="button" onclick="voir()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400" aria-label="Afficher"><i class="fas fa-eye" id="oeil"></i></button>
                </div>
                <ul id="regles" class="mt-2 grid grid-cols-2 gap-1 text-xs text-gray-500">
                    <li data-regle="^.{8,}$">○ 8 caractères minimum</li>
                    <li data-regle="[A-Z]">○ Une majuscule</li>
                    <li data-regle="[a-z]">○ Une minuscule</li>
                    <li data-regle="\d">○ Un chiffre</li>
                    <li data-regle="[@$!%*?&]">○ Un symbole (@$!%*?&)</li>
                </ul>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Confirmer le nouveau mot de passe</label>
                <input type="password" name="confirmation" required autocomplete="new-password" class="w-full px-3 py-2.5 border border-gray-300">
            </div>
            <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-xl font-semibold hover:bg-purple-700">Enregistrer</button>
            <a href="{{ url_for('boutique.dashboard') }}" class="block text-center text-sm text-gray-500 hover:text-gray-700">Annuler</a>
        </form>
    </div>
</div>

<script>
const champ = document.getElementById('nouveau');
champ.addEventListener('input', () => {
    document.querySelectorAll('#regles li').forEach((li) => {
        const ok = new RegExp(li.dataset.regle).test(champ.value);
        li.textContent = (ok ? '✓ ' : '○ ') + li.textContent.slice(2);
        li.className = ok ? 'text-green-600 font-medium' : '';
    });
});
function voir() {
    const visible = champ.type === 'text';
    champ.type = visible ? 'password' : 'text';
    document.getElementById('oeil').className = 'fas ' + (visible ? 'fa-eye' : 'fa-eye-slash');
}
</script>
{% endblock %}
